<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1115">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Treadmill Live</title>
<style>
  :root {
    --bg: #0f1115; --card: #1a1d24; --text: #f2f4f8; --muted: #8b93a3;
    --accent: #4fc3f7; --ok: #66bb6a; --bad: #ef5350; --hr: #ff7070;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 12px; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .status { font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--bad); }
  .dot.on { background: var(--ok); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .card { background: var(--card); border-radius: 14px; padding: 14px 16px; }
  .card.big { grid-column: 1 / -1; }
  .label { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .value { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .big .value { font-size: 72px; color: var(--accent); }
  .unit { font-size: 16px; color: var(--muted); font-weight: 500; margin-left: 4px; }
  .hr .value { color: var(--hr); }
  canvas { width: 100%; height: 140px; display: block; margin-top: 8px; }
  .version { margin-top: 12px; font-size: 12px; color: var(--muted); text-align: center; }
  .version a { color: inherit; }
  footer { margin-top: 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); }
  button { background: var(--card); color: var(--text); border: 1px solid #333a46; border-radius: 8px; padding: 8px 14px; font-size: 14px; }
  code { word-break: break-all; }
  nav a { color: var(--accent); text-decoration: none; font-size: 15px; }
  nav { display: flex; align-items: center; gap: 12px; }
  .fs { padding: 4px 10px; font-size: 16px; line-height: 1; }
  .runbar { margin: -4px 0 12px; font-size: 14px; color: var(--muted); min-height: 1.2em; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Treadmill Live</h1>
  <nav><a href="/runs">Runs</a> <button id="pip" class="fs" title="Pop out a small always-on-top window" hidden>Pop out</button> <button id="fs" class="fs" title="Full screen">⛶</button></nav>
  <div class="status"><span class="dot" id="dot"></span><span id="status">Connecting…</span></div>
</header>

<div class="runbar" id="runbar"></div>

<div class="grid">
  <div class="card big">
    <div class="label">Speed</div>
    <div class="value"><span id="speed">0.0</span><span class="unit" id="speedUnit">mph</span></div>
    <canvas id="chart"></canvas>
  </div>
  <div class="card"><div class="label">Time</div><div class="value" id="time">0:00</div></div>
  <div class="card"><div class="label">Distance</div><div class="value"><span id="distance">0.00</span><span class="unit" id="distUnit">mi</span></div></div>
  <div class="card"><div class="label">Pace</div><div class="value"><span id="pace">--</span><span class="unit" id="paceUnit">/mi</span></div></div>
  <div class="card"><div class="label">Incline</div><div class="value"><span id="incline">0</span><span class="unit">%</span></div></div>
  <div class="card hr" id="hrCard" hidden><div class="label">Heart rate</div><div class="value"><span id="hr">--</span><span class="unit">bpm</span></div></div>
  <div class="card" id="calCard" hidden><div class="label">Calories</div><div class="value"><span id="cal">0</span><span class="unit">kcal</span></div></div>
  <div class="card"><div class="label">Climb</div><div class="value"><span id="elev">0</span><span class="unit">ft</span></div></div>
</div>

<footer>
  <span></span>
  <button id="endRun" hidden>End run</button>
</footer>
<div class="version" id="version">Version –</div>

<script>
const $ = (id) => document.getElementById(id);
const history = [];
const MAX_POINTS = 600; // 10 minutes at 1 Hz

function fmtTime(s) {
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  const mm = h ? String(m).padStart(2, "0") : m;
  return (h ? h + ":" : "") + mm + ":" + String(sec).padStart(2, "0");
}
function fmtPace(min) {
  if (!min || min > 99) return "--";
  const m = Math.floor(min), s = Math.round((min - m) * 60);
  return s === 60 ? (m + 1) + ":00" : m + ":" + String(s).padStart(2, "0");
}

function draw() {
  const c = $("chart"), dpr = window.devicePixelRatio || 1;
  const w = c.clientWidth, h = c.clientHeight;
  c.width = w * dpr; c.height = h * dpr;
  const ctx = c.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  if (history.length < 2) return;
  const max = Math.max(4, ...history) * 1.1;
  ctx.strokeStyle = "#2a2f3a"; ctx.lineWidth = 1;
  ctx.fillStyle = "#8b93a3"; ctx.font = "11px system-ui";
  for (let v = 0; v <= max; v += max > 8 ? 2 : 1) {
    const y = h - (v / max) * h;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    ctx.fillText(v, 2, y - 2);
  }
  ctx.beginPath();
  history.forEach((v, i) => {
    const x = (i / (MAX_POINTS - 1)) * w, y = h - (v / max) * h;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  });
  ctx.strokeStyle = "#4fc3f7"; ctx.lineWidth = 2; ctx.stroke();
}

let wasActive = null;
function render(d) {
  if (d.run_active && wasActive === false) history.length = 0;  // new run: fresh chart
  wasActive = d.run_active;
  $("dot").classList.toggle("on", d.connected);
  $("status").textContent = d.connected ? (d.device || "Connected") : "Treadmill not connected";
  $("speed").textContent = d.speed.toFixed(1);
  $("speedUnit").textContent = d.speed_unit;
  $("distance").textContent = d.distance.toFixed(2);
  $("distUnit").textContent = d.distance_unit;
  $("pace").textContent = fmtPace(d.pace_min);
  $("paceUnit").textContent = d.pace_unit;
  $("incline").textContent = d.incline;
  $("hrCard").hidden = !d.hr_seen;
  $("calCard").hidden = d.calories == null;
  if (d.calories != null) $("cal").textContent = d.calories;
  $("hr").textContent = d.heart_rate || "--";
  $("endRun").hidden = !d.run_active;
  $("runbar").textContent = runStatus(d);
  $("elev").textContent = Math.round(d.elevation_ft);
  $("time").textContent = fmtTime(d.moving_seconds);
  drawMini(d);
  renderVersion(d);
  history.push(d.speed);
  if (history.length > MAX_POINTS) history.shift();
  draw();
}

function runStatus(d) {
  if (d.run_active) {
    if (d.idle_left != null) return "Paused – run ends in " + fmtTime(d.idle_left) + " unless the belt starts";
    return "Run in progress";
  }
  if (d.last_saved === true) return d.history ? "Run saved – see Runs" : "Run ended";
  if (d.last_saved === false) return "Run was under 30 seconds and wasn't saved";
  return "Start the belt to begin a run";
}

let shownVersion = null;
function renderVersion(d) {
  const key = d.version + "|" + d.built;
  if (key === shownVersion) return;
  shownVersion = key;
  const el = $("version");
  el.textContent = "Version ";
  if (d.version && d.version !== "dev") {
    const a = document.createElement("a");
    a.href = "https://github.com/simpat1zq/echelon-monitor/commit/" + d.version;
    a.textContent = d.version.slice(0, 7);
    el.appendChild(a);
  } else {
    el.append(d.version || "unknown");
  }
  if (d.built) el.append(" · built " + d.built);
}

function connect() {
  const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.onmessage = (e) => render(JSON.parse(e.data));
  ws.onclose = () => {
    $("dot").classList.remove("on");
    $("status").textContent = "Server offline – retrying…";
    setTimeout(connect, 2000);
  };
}

$("endRun").onclick = async () => {
  if (!confirm("End and save this run?")) return;
  await fetch("/api/end", { method: "POST" });
};
window.addEventListener("resize", draw);

// "Pop out": draw speed/time/distance onto a small canvas, stream it into a
// <video> and put that in Picture-in-Picture, which Android shows as a
// floating window on top of other apps.
const mini = document.createElement("canvas");
mini.width = 480; mini.height = 270;
const miniVideo = document.createElement("video");
miniVideo.muted = true; miniVideo.playsInline = true;
let miniStream = null, lastData = null;

function drawMini(d) {
  lastData = d;
  const ctx = mini.getContext("2d"), W = mini.width, H = mini.height;
  ctx.fillStyle = "#0f1115"; ctx.fillRect(0, 0, W, H);
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = d.connected ? "#4fc3f7" : "#8b93a3";
  ctx.font = "700 110px system-ui, sans-serif";
  const sp = d.speed.toFixed(1);
  ctx.fillText(sp, 24, 122);
  const spW = ctx.measureText(sp).width;
  ctx.fillStyle = "#8b93a3"; ctx.font = "500 30px system-ui, sans-serif";
  ctx.fillText(d.speed_unit, 36 + spW, 122);
  ctx.fillStyle = "#f2f4f8"; ctx.font = "700 64px system-ui, sans-serif";
  ctx.fillText(fmtTime(d.moving_seconds), 24, 222);
  const dist = d.distance.toFixed(2);
  ctx.textAlign = "right";
  ctx.font = "500 30px system-ui, sans-serif"; ctx.fillStyle = "#8b93a3";
  const unitW = ctx.measureText(" " + d.distance_unit).width;
  ctx.fillText(" " + d.distance_unit, W - 24, 222);
  ctx.font = "700 64px system-ui, sans-serif"; ctx.fillStyle = "#f2f4f8";
  ctx.fillText(dist, W - 24 - unitW, 222);
  ctx.textAlign = "left";
  ctx.font = "500 24px system-ui, sans-serif"; ctx.fillStyle = "#8b93a3";
  ctx.fillText("TIME", 26, 160);
  ctx.textAlign = "right"; ctx.fillText("DISTANCE", W - 24, 160); ctx.textAlign = "left";
  if (!d.connected) {
    ctx.fillStyle = "#ef5350"; ctx.font = "600 24px system-ui, sans-serif";
    ctx.textAlign = "right"; ctx.fillText("not connected", W - 24, 40); ctx.textAlign = "left";
  }
}

const pipBtn = $("pip");
pipBtn.hidden = !(document.pictureInPictureEnabled && mini.captureStream);
pipBtn.onclick = async () => {
  try {
    if (document.pictureInPictureElement) { await document.exitPictureInPicture(); return; }
    if (!miniStream) { miniStream = mini.captureStream(2); miniVideo.srcObject = miniStream; }
    if (lastData) drawMini(lastData);
    await miniVideo.play();
    await miniVideo.requestPictureInPicture();
  } catch (e) {
    alert("Couldn't open the pop-out window: " + e.message);
  }
};
// Redraw regularly so the floating window keeps getting frames.
setInterval(() => { if (lastData && document.pictureInPictureElement) drawMini(lastData); }, 1000);

// Full screen on demand (fallback when the home-screen app isn't installed).
const fsBtn = $("fs");
fsBtn.hidden = !document.documentElement.requestFullscreen ||
  window.matchMedia("(display-mode: fullscreen)").matches;
fsBtn.onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
};

// Keep the screen on while the dashboard is open.
let wakeLock = null;
async function keepAwake() {
  try {
    if ("wakeLock" in navigator && document.visibilityState === "visible" && !wakeLock) {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => (wakeLock = null));
    }
  } catch (e) { /* not supported or not allowed */ }
}
document.addEventListener("visibilitychange", keepAwake);
keepAwake();

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
connect();
</script>
</body>
</html>
