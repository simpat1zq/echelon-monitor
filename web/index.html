<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1115">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Treadmill Live</title>
<style>
  :root {
    --bg: #0f1115; --card: #1a1d24; --text: #f2f4f8; --muted: #8b93a3;
    --accent: #4fc3f7; --ok: #66bb6a; --bad: #ef5350; --hr: #ff7070;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .card { background: var(--card); border-radius: 14px; padding: 14px 16px; }
  .card.big { grid-column: 1 / -1; }
  .label { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .value { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .big .value { font-size: 72px; color: var(--accent); }
  .unit { font-size: 16px; color: var(--muted); font-weight: 500; margin-left: 4px; }
  .hr .value { color: var(--hr); }
  canvas { width: 100%; height: 140px; display: block; margin-top: 8px; }
  .version { margin-top: 12px; font-size: 12px; color: var(--muted); text-align: center; }
  .version a { color: inherit; }
  footer { margin-top: 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); }
  button { background: var(--card); color: var(--text); border: 1px solid #333a46; border-radius: 8px; padding: 8px 14px; font-size: 14px; }
  code { word-break: break-all; }
  /* Speed/incline controls: big targets so they're easy to hit while running. */
  .ctl { display: flex; align-items: center; gap: 12px; }
  .ctl .readout { flex: 1; text-align: center; min-width: 0; }
  .step { flex: none; width: 84px; height: 84px; border-radius: 18px; padding: 0;
          font-size: 48px; font-weight: 600; line-height: 1; background: #22324a; border: 1px solid #2f4a6a;
          color: var(--text); touch-action: none; user-select: none; -webkit-user-select: none;
          -webkit-touch-callout: none; cursor: pointer; }
  .step:active, .step.held { background: #2f4a6a; }
  .step:disabled { opacity: .35; }
  .target { font-size: 15px; color: var(--muted); min-height: 1.3em; font-variant-numeric: tabular-nums; }
  .ctl-note { font-size: 13px; color: var(--muted); text-align: center; min-height: 1.2em; margin-top: 4px; }
  .runbar { margin: -4px 0 12px; font-size: 14px; color: var(--muted); min-height: 1.2em; }
  [hidden] { display: none !important; }
</style>
<link rel="stylesheet" href="/menu.css">
</head>
<body>
<header class="topbar">
  <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
  <div class="title">
    <h1>Treadmill</h1>
    <div class="runner" id="runner"></div>
  </div>
  <button class="pill" id="overlayBtn" hidden>Overlay</button>
  <span class="light" id="dot" title="Treadmill not connected"></span>
</header>

<div class="runbar" id="runbar"></div>

<div class="grid">
  <div class="card big">
    <div class="label">Speed</div>
    <div class="ctl">
      <button class="step" id="speedDown" aria-label="Slower" disabled>−</button>
      <div class="readout">
        <div class="value"><span id="speed">0.0</span><span class="unit" id="speedUnit">mph</span></div>
        <div class="target" id="speedTarget"></div>
      </div>
      <button class="step" id="speedUp" aria-label="Faster" disabled>+</button>
    </div>
    <div class="ctl-note" id="speedNote"></div>
    <canvas id="chart"></canvas>
  </div>
  <div class="card big">
    <div class="label">Incline</div>
    <div class="ctl">
      <button class="step" id="inclineDown" aria-label="Lower incline" disabled>−</button>
      <div class="readout">
        <div class="value"><span id="incline">0</span><span class="unit">%</span></div>
        <div class="target" id="inclineTarget"></div>
      </div>
      <button class="step" id="inclineUp" aria-label="Raise incline" disabled>+</button>
    </div>
    <div class="ctl-note" id="inclineNote"></div>
  </div>
  <div class="card"><div class="label">Time</div><div class="value" id="time">0:00</div></div>
  <div class="card"><div class="label">Distance</div><div class="value"><span id="distance">0.00</span><span class="unit" id="distUnit">mi</span></div></div>
  <div class="card"><div class="label">Pace</div><div class="value"><span id="pace">--</span><span class="unit" id="paceUnit">/mi</span></div></div>
  <div class="card hr" id="hrCard" hidden><div class="label">Heart rate</div><div class="value"><span id="hr">--</span><span class="unit">bpm</span></div></div>
  <div class="card" id="calCard" hidden><div class="label">Calories</div><div class="value"><span id="cal">0</span><span class="unit">kcal</span></div></div>
  <div class="card"><div class="label">Climb</div><div class="value"><span id="elev">0</span><span class="unit">ft</span></div></div>
</div>

<footer>
  <span></span>
  <button id="endRun" hidden>End run</button>
</footer>
<div class="version" id="version">Version –</div>

<script>
const $ = (id) => document.getElementById(id);
const history = [];
const MAX_POINTS = 600; // 10 minutes at 1 Hz

function fmtTime(s) {
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  const mm = h ? String(m).padStart(2, "0") : m;
  return (h ? h + ":" : "") + mm + ":" + String(sec).padStart(2, "0");
}
function fmtPace(min) {
  if (!min || min > 99) return "--";
  const m = Math.floor(min), s = Math.round((min - m) * 60);
  return s === 60 ? (m + 1) + ":00" : m + ":" + String(s).padStart(2, "0");
}

function draw() {
  const c = $("chart"), dpr = window.devicePixelRatio || 1;
  const w = c.clientWidth, h = c.clientHeight;
  c.width = w * dpr; c.height = h * dpr;
  const ctx = c.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  if (history.length < 2) return;
  const max = Math.max(4, ...history) * 1.1;
  ctx.strokeStyle = "#2a2f3a"; ctx.lineWidth = 1;
  ctx.fillStyle = "#8b93a3"; ctx.font = "11px system-ui";
  for (let v = 0; v <= max; v += max > 8 ? 2 : 1) {
    const y = h - (v / max) * h;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    ctx.fillText(v, 2, y - 2);
  }
  ctx.beginPath();
  history.forEach((v, i) => {
    const x = (i / (MAX_POINTS - 1)) * w, y = h - (v / max) * h;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  });
  ctx.strokeStyle = "#4fc3f7"; ctx.lineWidth = 2; ctx.stroke();
}

let wasActive = null;
function render(d) {
  if (d.run_active && wasActive === false) history.length = 0;  // new run: fresh chart
  wasActive = d.run_active;
  $("dot").classList.toggle("on", d.connected);
  $("dot").title = d.connected ? "Treadmill connected" : "Treadmill not connected";
  $("runner").textContent = d.user ? d.user.name : (d.history ? "Who's running? Tap to choose" : "");
  $("speed").textContent = d.speed.toFixed(1);
  $("speedUnit").textContent = d.speed_unit;
  $("distance").textContent = d.distance.toFixed(2);
  $("distUnit").textContent = d.distance_unit;
  $("pace").textContent = fmtPace(d.pace_min);
  $("paceUnit").textContent = d.pace_unit;
  $("incline").textContent = d.incline;
  renderControls(d);
  $("hrCard").hidden = !d.hr_seen;
  $("calCard").hidden = d.calories == null;
  if (d.calories != null) $("cal").textContent = d.calories;
  $("hr").textContent = d.heart_rate || "--";
  $("endRun").hidden = !d.run_active;
  $("runbar").textContent = runStatus(d);
  $("elev").textContent = Math.round(d.elevation_ft);
  $("time").textContent = fmtTime(d.moving_seconds);
  renderVersion(d);
  history.push(d.speed);
  if (history.length > MAX_POINTS) history.shift();
  draw();
}

// --- speed / incline buttons ----------------------------------------------
// A tap changes by one step; holding repeats (speed 0.1 every 100 ms = 1 per
// second, incline 1 per second). Requests go out at most every 250 ms.
const controls = {
  speed: { step: 0.1, delay: 500, every: 100, digits: 1 },
  incline: { step: 1, delay: 1000, every: 1000, digits: 0 },
};
let last = null;

// Right after a press, use what was asked for even before the server echoes it.
const recent = (c) => c.target != null && (c.timer || Date.now() - c.pressedAt < 1500);

function renderControls(d) {
  last = d;
  const moving = d.connected && d.speed > 0;
  $("speedUp").disabled = $("speedDown").disabled = !moving;
  $("inclineUp").disabled = $("inclineDown").disabled = !d.connected;
  $("speedNote").textContent = controls.speed.error || (d.connected && !moving ? "Start the belt on the treadmill to change speed" : "");
  $("inclineNote").textContent = controls.incline.error || "";
  for (const [key, c] of Object.entries(controls)) {
    const target = recent(c) ? c.target : d["target_" + key];
    const shown = target != null && Math.abs(target - d[key]) >= 0.05;
    $(key + "Target").textContent = shown
      ? "→ " + target.toFixed(c.digits) + (key === "speed" ? " " + d.speed_unit : "%") : "";
  }
}

function bump(key, dir) {
  const c = controls[key];
  const base = recent(c) ? c.target : (last["target_" + key] != null ? last["target_" + key] : last[key]);
  const lo = key === "speed" ? last.speed_min : 0, hi = key === "speed" ? last.speed_max : last.incline_max;
  const next = Math.min(hi, Math.max(lo, Math.round((base + dir * c.step) / c.step) * c.step));
  c.target = +next.toFixed(c.digits);
  c.pressedAt = Date.now();
  send(key);
  renderControls(last);
}

function send(key) {
  const c = controls[key];
  const wait = 250 - (Date.now() - (c.sentAt || 0));
  if (wait > 0) {
    if (!c.pending) c.pending = setTimeout(() => { c.pending = null; send(key); }, wait);
    return;
  }
  c.sentAt = Date.now();
  fetch("/api/control", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ [key]: c.target }),
  }).then((r) => r.json()).then((res) => {
    c.error = res.ok ? null : res.error;
    if (!res.ok) setTimeout(() => { c.error = null; }, 4000);
    if (!res.ok) c.target = null;
    if (last) renderControls(last);
  }).catch(() => { c.error = "Couldn't reach the server"; });
}

function holdable(btn, key, dir) {
  const c = controls[key];
  const stop = () => {
    clearTimeout(c.timer); clearInterval(c.timer); c.timer = null;
    btn.classList.remove("held");
  };
  btn.addEventListener("pointerdown", (e) => {
    if (btn.disabled || !last) return;
    e.preventDefault();
    btn.setPointerCapture(e.pointerId);
    btn.classList.add("held");
    bump(key, dir);
    c.timer = setTimeout(() => { c.timer = setInterval(() => bump(key, dir), c.every); }, c.delay);
  });
  for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) btn.addEventListener(ev, stop);
  btn.addEventListener("contextmenu", (e) => e.preventDefault());
}
holdable($("speedUp"), "speed", 1);
holdable($("speedDown"), "speed", -1);
holdable($("inclineUp"), "incline", 1);
holdable($("inclineDown"), "incline", -1);

function runStatus(d) {
  if (d.run_active) {
    if (d.idle_left != null) return "Paused – run ends in " + fmtTime(d.idle_left) + " unless the belt starts";
    return "Run in progress";
  }
  if (d.last_saved === true) return d.history ? "Run saved – see Runs" : "Run ended";
  if (d.last_saved === false) return "Run was under 30 seconds and wasn't saved";
  return "Start the belt to begin a run";
}

let shownVersion = null;
function renderVersion(d) {
  const key = d.version + "|" + d.built;
  if (key === shownVersion) return;
  shownVersion = key;
  const el = $("version");
  el.textContent = "Version ";
  if (d.version && d.version !== "dev") {
    const a = document.createElement("a");
    a.href = "https://github.com/simpat1zq/echelon-monitor/commit/" + d.version;
    a.textContent = d.version.slice(0, 7);
    el.appendChild(a);
  } else {
    el.append(d.version || "unknown");
  }
  if (d.built) el.append(" · built " + d.built);
}

function connect() {
  const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.onmessage = (e) => render(JSON.parse(e.data));
  ws.onclose = () => {
    $("dot").classList.remove("on");
    $("dot").title = "Server offline – retrying…";
    setTimeout(connect, 2000);
  };
}

$("endRun").onclick = async () => {
  if (!confirm("End and save this run?")) return;
  await fetch("/api/end", { method: "POST" });
};
window.addEventListener("resize", draw);

$("runner").onclick = () => window.TreadmillMenu && window.TreadmillMenu.open();

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
connect();
</script>
<script src="/menu.js"></script>
</body>
</html>
