name: Build Android overlay app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle -p android assembleDebug -PversionCode=${{ github.run_number }}
      - name: Publish to the "android" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk echelon-overlay.apk
          echo '{"versionCode": ${{ github.run_number }}, "versionName": "1.0.${{ github.run_number }}"}' > echelon-overlay.json
          if ! gh release view android >/dev/null 2>&1; then
            gh release create android --target "$GITHUB_SHA" --latest=false \
              --title "Android overlay app" \
              --notes "Floating treadmill stats for Android. Download echelon-overlay.apk on the tablet and install it."
          fi
          gh release upload android echelon-overlay.apk echelon-overlay.json --clobber
