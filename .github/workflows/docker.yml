name: Build image

on:
  push:
    branches: [main]
    paths-ignore: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
  # Rebuild after a new Android APK is published, so the image serves it.
  workflow_run:
    workflows: ["Build Android overlay app"]
    types: [completed]

# One build at a time, so an older build never overwrites a newer :latest.
concurrency:
  group: docker-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Include the latest Android overlay APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download android -p 'echelon-overlay.*' -D web --clobber || echo "No APK published yet"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: date
        run: echo "value=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.sha }}
            APP_BUILD_DATE=${{ steps.date.outputs.value }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
